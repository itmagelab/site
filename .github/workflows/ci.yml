# Проверки проекта: сборка сайта, тесты контента и проверка собранных страниц.
name: CI - Build & Checks

on:
    workflow_dispatch:
    push:
        branches: ["master", "test/*"]
        tags: ["v*.*.*"]
    pull_request:
        branches: ["master"]

permissions:
    contents: read

jobs:
    build-and-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build static site
              run: npm run build

            - name: Run tests
              run: npm test

            - name: Check built pages
              run: npm run check
